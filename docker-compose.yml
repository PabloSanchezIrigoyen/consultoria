services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: constructora_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/constructora_app.sql:/docker-entrypoint-initdb.d/constructora_app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d constructora_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "5174:5174"
    environment:
      PORT: 5174
      DATABASE_URL: postgres://postgres:root@db:5432/constructora_app
      JWT_SECRET: dev-secret-change-me
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./inventario-constructora:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:5174
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
